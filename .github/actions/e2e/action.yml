name: 'E2E'
description: 'Run the two-interface stunmesh e2e against a build-stage artifact'

inputs:
  os:
    description: 'Target OS (linux, darwin, freebsd, windows)'
    required: true
  arch:
    description: 'Target architecture (amd64, arm64)'
    required: true
  app-name:
    description: 'Application name; the artifact is <app-name>-<os>-<arch>'
    required: true

runs:
  using: 'composite'
  steps:
    - uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.app-name }}-${{ inputs.os }}-${{ inputs.arch }}${{ inputs.os == 'windows' && '.exe' || '' }}

    # os is an input, not runner.os: freebsd runs in a VM on a Linux host, so
    # runner.os is Linux for both the linux and freebsd targets.
    - name: Install tools (Linux)
      if: inputs.os == 'linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y wireguard-tools jq

    - name: Install tools (macOS)
      if: inputs.os == 'darwin'
      shell: bash
      run: brew install wireguard-tools wireguard-go jq

    # The official installer always installs the latest client and picks the
    # arch itself -- deliberate: the weekly scheduled run then doubles as an
    # early warning when a new WireGuard release breaks us. The runner shell
    # is already elevated, which the tunnel service and stunmesh both require.
    # The installer hands off to a child MSI process, so poll for the binary
    # instead of trusting -Wait alone.
    - name: Install tools (Windows)
      if: inputs.os == 'windows'
      shell: pwsh
      run: |
        $installer = Join-Path $env:RUNNER_TEMP 'wireguard-installer.exe'
        Invoke-WebRequest -Uri 'https://download.wireguard.com/windows-client/wireguard-installer.exe' -OutFile $installer
        Start-Process $installer -ArgumentList '/install','/quiet' -Wait
        $wg = 'C:\Program Files\WireGuard\wireguard.exe'
        for ($i = 0; $i -lt 60 -and -not (Test-Path $wg); $i++) { Start-Sleep 2 }
        if (-not (Test-Path $wg)) { throw 'WireGuard install did not complete' }
        Add-Content $env:GITHUB_PATH 'C:\Program Files\WireGuard'

    # Git Bash: run.sh branches on uname (MINGW* -> Windows) and drives
    # wireguard.exe /installtunnelservice; jq and curl ship with the runner.
    - name: Run e2e (Windows)
      if: inputs.os == 'windows'
      shell: bash
      run: sh test/e2e/run.sh "./${{ inputs.app-name }}-windows-${{ inputs.arch }}.exe"

    - name: Run e2e
      if: inputs.os == 'linux' || inputs.os == 'darwin'
      shell: bash
      run: |
        bin=${{ inputs.app-name }}-${{ inputs.os }}-${{ inputs.arch }}
        chmod +x "$bin"
        sh test/e2e/run.sh "./$bin"

    # FreeBSD runs everything inside the guest; aarch64 needs an arm64 host so
    # the guest is virtualized natively rather than emulated.
    - name: Run e2e (FreeBSD VM)
      if: inputs.os == 'freebsd'
      uses: vmactions/freebsd-vm@v1
      with:
        arch: ${{ inputs.arch == 'arm64' && 'aarch64' || inputs.arch }}
        sync: sshfs
        prepare: |
          pkg install -y wireguard-tools jq curl
          kldload if_wg
        run: |
          cd $GITHUB_WORKSPACE
          bin=${{ inputs.app-name }}-freebsd-${{ inputs.arch }}
          chmod +x "$bin"
          sh test/e2e/run.sh "./$bin"
