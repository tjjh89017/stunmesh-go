name: 'Build Android AAR'
description: 'Build stunmesh.aar from the mobile/ package with gomobile'
runs:
  using: composite
  steps:
    - name: Install gomobile
      shell: bash
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        gomobile init

    # Through make so the Makefile target is what CI exercises, rather than a
    # second copy of the gomobile flags that can drift from it.
    - name: Build AAR
      shell: bash
      run: |
        export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME}"
        make mobile
        ls -lh stunmesh.aar
