name: 'Build Android AAR'
description: 'Build the Android AAR from the mobile package with gomobile'

inputs:
  go-version:
    description: 'Go version to use'
    required: true
    default: 'stable'
  version:
    description: 'Version stamped into the AAR and used in its file name (make MOBILE_VERSION). Defaults to git describe.'
    required: false
    default: ''
  android-api:
    description: 'Minimum Android API level (passed to make as ANDROID_API)'
    required: false
    default: '26'

outputs:
  aar-name:
    description: 'Name of the built AAR'
    value: ${{ steps.build.outputs.aar-name }}
  sources-name:
    description: 'Name of the sources jar gomobile emits beside the AAR'
    value: ${{ steps.build.outputs.sources-name }}

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}

    - name: Install gomobile
      shell: bash
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        gomobile init

    # Through make so the Makefile target is what CI exercises, rather than a
    # second copy of the gomobile flags that can drift from it. The name
    # carries the version, so ask make for it rather than guessing.
    - name: Build
      id: build
      shell: bash
      run: |
        export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME}"
        # Exported, not passed per invocation: print-aar must derive the same
        # name the build just wrote, and a second git describe could differ.
        if [ -n "${{ inputs.version }}" ]; then
          export MOBILE_VERSION="${{ inputs.version }}"
        fi
        make android ANDROID_API=${{ inputs.android-api }}
        AAR_NAME="$(make -s print-aar)"
        SOURCES_NAME="${AAR_NAME%.aar}-sources.jar"
        echo "aar-name=${AAR_NAME}" >> "$GITHUB_OUTPUT"
        echo "sources-name=${SOURCES_NAME}" >> "$GITHUB_OUTPUT"
        ls -lh "${AAR_NAME}" "${SOURCES_NAME}"
