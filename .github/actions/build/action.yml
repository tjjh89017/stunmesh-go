name: 'Build Application'
description: 'Build the application for specified OS and architecture'

inputs:
  os:
    description: 'Target OS (linux, darwin, freebsd, windows)'
    required: true
  arch:
    description: 'Target architecture (amd64, arm64, arm, mipsle)'
    required: true
  app-name:
    description: 'Application name'
    required: true
  go-version:
    description: 'Go version to use'
    required: true
    default: 'stable'
  tag:
    description: 'Tag to append to binary name'
    required: false
    default: ''
  embedca:
    description: 'Embed the Mozilla CA bundle when not 0 (passed to make as EMBED_CA)'
    required: false
    default: '0'

outputs:
  binary-name:
    description: 'Name of the built binary'
    value: ${{ steps.build-info.outputs.binary-name }}

runs:
  using: 'composite'
  steps:
    - name: Set build info
      id: build-info
      shell: bash
      run: |
        BINARY_NAME="${{ inputs.app-name }}-${{ inputs.os }}-${{ inputs.arch }}"
        if [ "${{ inputs.embedca }}" != "0" ]; then
          BINARY_NAME="${BINARY_NAME}-ca"
        fi
        if [ -n "${{ inputs.tag }}" ]; then
          BINARY_NAME="${BINARY_NAME}-${{ inputs.tag }}"
        fi
        if [ "${{ inputs.os }}" = "windows" ]; then
          BINARY_NAME="${BINARY_NAME}.exe"
        fi
        echo "binary-name=$BINARY_NAME" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}

    - name: Build
      shell: bash
      run: make APP=${{ steps.build-info.outputs.binary-name }} EMBED_CA=${{ inputs.embedca }}
      env:
        GOARCH: ${{ inputs.arch }}
        GOOS: ${{ inputs.os }}
