name: Mobile

on:
  push:
    branches: [feature/mobile]
    paths:
      - 'mobile/**'
      - 'internal/**'
      - 'pluginapi/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/mobile.yml'
      - '.github/actions/build-aar/**'
  pull_request:
    paths:
      - 'mobile/**'
      - 'internal/**'
      - 'pluginapi/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/mobile.yml'
      - '.github/actions/build-aar/**'

jobs:
  aar:
    name: Build Android AAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The mobile packages are excluded from the default build by their tag,
      # so the main workflow's test job never sees them.
      - name: Test
        run: go test -tags mobile ./internal/mobilebind/... ./mobile/...

      - name: Build AAR
        uses: ./.github/actions/build-aar

      - uses: actions/upload-artifact@v7
        with:
          name: stunmesh-aar
          path: |
            stunmesh.aar
            stunmesh-sources.jar
